name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Check source file length
        run: python ../scripts/check_file_length.py
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend tests, type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-fund --no-audit
      - name: Run tests
        run: npm test
      - name: Type check and build
        run: npm run build
      - name: Bundle makes no request to another origin
        run: |
          # Licence banners and XML namespaces mention URLs without fetching them.
          # Anything else in the bundle that names another host fails the build.
          found="$(grep -rhoE "https?://[A-Za-z0-9./_-]+" dist | sort -u \
            | grep -vE "^https?://(www\.w3\.org|react\.dev|reactjs\.org|tailwindcss\.com|github\.com|lucide\.dev|127\.0\.0\.1|localhost)(/|$)" || true)"
          if [ -n "$found" ]; then
            echo "Unexpected external URLs in the bundle:"
            echo "$found"
            exit 1
          fi

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8083
      API: http://127.0.0.1:8083/api/v1
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: UI is served with its security headers
        run: |
          # "up --wait" waits for the backend health check; Nginx has none, so the
          # first request retries while its port is still closed.
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused "$BASE_URL/" | grep -q "AssetFlow Multi-Pipeline"
          curl --silent --head "$BASE_URL/" | grep -i "^content-security-policy:"
      - name: API answers through the proxy
        run: curl --fail --silent --show-error "$API/health" | grep -q '"status":"ok"'
      - name: A request made on behalf of another site is refused
        run: |
          for origin in cross-site same-site; do
            code="$(curl --silent -o /dev/null -w "%{http_code}" -X POST -H "Sec-Fetch-Site: $origin" "$API/assets/reset")"
            echo "$origin: HTTP $code"
            test "$code" = "403"
          done
          code="$(curl --silent -o /dev/null -w "%{http_code}" -H "Sec-Fetch-Site: same-origin" "$API/health")"
          test "$code" = "200"
      - name: Stream reaches the client through Nginx without buffering
        run: |
          # The stream is opened first; the command sent afterwards must arrive
          # on it as an update. Exit status 28 is curl's own time limit: both
          # events may have arrived although the connection closed late, so the
          # captured events decide. Any other failure fails the step.
          curl --fail --silent --show-error --no-buffer --max-time 20 "$API/stream?max_events=2" > stream.txt &
          stream_pid=$!
          sleep 2
          curl --fail --silent --show-error -X PATCH -H "Content-Type: application/json"             -d '{"stage":"TECHNICAL_DUE_DILIGENCE"}' "$API/assets/AST-401/stage"
          status=0
          wait "$stream_pid" || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 28 ]; then
            echo "curl failed with status $status; captured output:"
            cat stream.txt
            exit 1
          fi
          for event in snapshot update; do
            if ! grep -q "^event: $event" stream.txt; then
              echo "no '$event' event was delivered; captured output:"
              cat stream.txt
              exit 1
            fi
          done
      - name: A stage of another pipeline is refused
        run: |
          code="$(curl --silent -o refused.json -w "%{http_code}" -X PATCH -H "Content-Type: application/json"             -d '{"stage":"CIVIL_EXECUTION"}' "$API/assets/AST-401/stage")"
          cat refused.json
          test "$code" = "422"
      - name: Soft delete, trash bin, restore and purge round trip
        run: |
          curl --fail --silent --show-error -X DELETE "$API/assets/AST-403"
          curl --fail --silent --show-error "$API/state" > state.json
          grep -q '"trash":\[{"asset_id":"AST-403"' state.json
          grep -q '"active_assets":13' state.json
          # An asset in the trash bin cannot be moved.
          code="$(curl --silent -o /dev/null -w "%{http_code}" -X PATCH -H "Content-Type: application/json"             -d '{"stage":"TITLE_CLOSED"}' "$API/assets/AST-403/stage")"
          test "$code" = "409"
          curl --fail --silent --show-error -X POST "$API/trash/AST-403/restore"
          curl --fail --silent --show-error "$API/state" | grep -q '"active_assets":14'
          # Purge is refused for an active asset and accepted for one in the trash bin.
          code="$(curl --silent -o /dev/null -w "%{http_code}" -X DELETE "$API/trash/AST-403/purge")"
          test "$code" = "409"
          curl --fail --silent --show-error -X DELETE "$API/trash/AST-414/purge"
      - name: CSV import accepts the sample batch once and rejects it the second time
        run: |
          curl --fail --silent --show-error -o sample.csv "$API/assets/sample-csv"
          curl --fail --silent --show-error -X POST --data-binary @sample.csv -H "Content-Type: text/csv"             "$API/assets/import-csv" | grep -q '"rejected_rows":0'
          curl --fail --silent --show-error -X POST --data-binary @sample.csv -H "Content-Type: text/csv"             "$API/assets/import-csv" | grep -q '"rejected_rows":5'
      - name: Workbook export, then reset
        run: |
          curl --fail --silent --show-error -o portfolio.xlsx "$API/assets/export-xlsx"
          test "$(head -c 2 portfolio.xlsx)" = "PK"
          curl --fail --silent --show-error -X POST "$API/assets/reset" > /dev/null
          curl --fail --silent --show-error "$API/state" | grep -q '"active_assets":14'
      - name: Containers do not run as root
        run: |
          # Assigned separately so the step fails if the command itself fails,
          # instead of comparing an empty string against "0".
          backend_uid="$(docker compose exec -T backend id -u)"
          frontend_uid="$(docker compose exec -T frontend id -u)"
          echo "backend uid=$backend_uid, frontend uid=$frontend_uid"
          [[ "$backend_uid" =~ ^[0-9]+$ && "$backend_uid" != "0" ]]
          [[ "$frontend_uid" =~ ^[0-9]+$ && "$frontend_uid" != "0" ]]
      - name: Show container state and logs on failure
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
