name: assetflow-multi-pipeline

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ASSETFLOW_HEARTBEAT_SECONDS: "5"
      ASSETFLOW_RETENTION_DAYS: "30"
    # Not published to the host: only the frontend proxy can reach it.
    expose:
      - "8000"
    # The health check is defined once, in backend/Dockerfile (HEALTHCHECK).
    # The frontend below waits for it through "condition: service_healthy".
    read_only: true
    # The spreadsheet library writes temporary files while it builds a workbook,
    # so the read-only container still needs a writable, in-memory /tmp. It is
    # capped: without a size, a tmpfs may grow to half of the host's memory.
    # 64 MB leaves room for two workbooks at the 25 MB expansion limit that
    # uploads are held to; revisit it if that limit changes.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Bound to localhost only. The commands have no authentication, so do not
    # publish this port to a network without adding access control.
    ports:
      - "127.0.0.1:8083:8080"
    read_only: true
    # Nginx keeps its pid file and temporary request bodies here. Request
    # bodies are limited to 3 MB (client_max_body_size), so 32 MB is ample.
    tmpfs:
      - /tmp:size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
